<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dasbor Guru Batik Jetis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Caprasimo&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Dasbor guru: satu tampilan terang (cocok untuk proyektor kelas), aksen warna batik Jetis. */
:root{
  --kertas:#FBF3E2; --kartu:#FFFFFF; --garis:#E7D5B1; --tinta:#2A1A10; --tinta-2:#6B4A33; --redup:#8C7358;
  --merah:#B8321F; --merah-tua:#7E1F12; --kunyit:#F2B632; --kunyit-tua:#B9861C; --daun:#3E8E4F; --daun-tua:#235C31; --nila:#2C4A94;
  --bahaya-bg:#FBE9E3;
  --f-display:'Baloo 2','Trebuchet MS',system-ui,sans-serif; --f-body:'Nunito','Segoe UI',system-ui,sans-serif; --f-papan:Caprasimo,Georgia,serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{background:var(--kertas);background-image:radial-gradient(rgba(184,50,31,.07) 1.3px,transparent 1.6px);background-size:16px 16px;color:var(--tinta);font-family:var(--f-body);font-size:16px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-inline:max(16px,3vw);padding-block:12px;background:var(--merah);color:#FFF6E4;border-bottom:6px solid var(--kunyit)}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand b{font-family:var(--f-papan);font-weight:400;font-size:22px}
.brand span{font-family:var(--f-display);font-weight:700;opacity:.85}
.bar a{color:#FFF6E4;font-weight:800}
main{max-width:1240px;margin:0 auto;padding-inline:max(16px,3vw);padding-block:22px 40px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.1;text-wrap:balance}
h1{font-size:clamp(26px,3.2vw,38px)}
h2{font-size:21px}
.panel{background:var(--kartu);border:2px solid var(--garis);border-radius:18px;padding:18px}
.btn{font-family:var(--f-display);font-weight:800;font-size:17px;border:none;border-radius:999px;padding:.38em 1.3em;cursor:pointer;background:var(--daun);color:#fff;box-shadow:0 3px 0 var(--daun-tua);text-decoration:none;display:inline-flex;align-items:center;gap:.4em}
.btn.alt{background:#fff;color:var(--tinta-2);box-shadow:0 3px 0 var(--garis);border:2px solid var(--garis)}
.btn.merah{background:var(--merah);box-shadow:0 3px 0 var(--merah-tua)}
.btn.kuning{background:var(--kunyit);color:var(--tinta);box-shadow:0 3px 0 var(--kunyit-tua)}
.btn.besar{font-size:22px;padding:.35em 1.6em}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn:focus-visible,input:focus-visible,select:focus-visible,.link:focus-visible{outline:3px solid var(--nila);outline-offset:2px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:800;color:var(--tinta-2)}
input.t,select.t{font:700 18px var(--f-body);padding:.45em .7em;border:2px solid var(--garis);border-radius:12px;background:#fff;color:var(--tinta);min-width:0}
.mulai-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px}
@media (max-width:820px){.mulai-grid{grid-template-columns:1fr}}
.form{display:flex;flex-direction:column;gap:14px}
.muted{color:var(--redup);font-weight:700;margin:0}
.kelas-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.kelas-list li{display:flex;justify-content:space-between;align-items:center;gap:10px;border:2px solid var(--garis);border-radius:12px;padding:.5em .8em;flex-wrap:wrap}
.kelas-list b{font-family:var(--f-display)}
.link{background:none;border:none;padding:0;font:800 15px var(--f-body);color:var(--merah);cursor:pointer;text-decoration:underline}
.cara{margin:0;padding-left:1.2em;display:grid;gap:6px;font-weight:700;color:var(--tinta-2)}

/* kepala dasbor */
.kepala{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:.4em;font:800 14px var(--f-body);border-radius:999px;padding:.2em .8em;background:#EFE1C4;color:var(--tinta-2)}
.chip.lobby{background:#FFF0C7;color:#7A5300}
.chip.main{background:#DDF0D6;color:var(--daun-tua)}
.chip.selesai{background:#E8E3DA;color:#5A4E40}
.chip i{width:.6em;height:.6em;border-radius:50%;background:currentColor}
.gabung{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:22px;align-items:center;background:var(--tinta);color:#FFF6E4;border-radius:22px;padding:22px 26px}
.gabung p{margin:0;font-weight:700;font-size:18px;color:#E9D7B7}
.gabung .url{font-family:var(--f-display);font-weight:800;color:var(--kunyit);font-size:22px;word-break:break-all}
.pin{font-family:var(--f-display);font-weight:800;font-size:clamp(54px,8vw,104px);letter-spacing:.08em;line-height:1;color:#fff;font-variant-numeric:tabular-nums}
.qr{background:#fff;border-radius:16px;padding:10px;width:clamp(140px,16vw,210px);height:auto;display:block}
.gabung.ringkas{grid-template-columns:minmax(0,1fr) auto;padding:14px 20px}
.gabung.ringkas .pin{font-size:44px}
.gabung.ringkas .qr{width:96px}
@media (max-width:640px){.gabung{grid-template-columns:1fr}.qr{justify-self:start}}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:820px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--kartu);border:2px solid var(--garis);border-radius:16px;padding:12px 16px}
.stat b{display:block;font:800 32px var(--f-display);font-variant-numeric:tabular-nums;color:var(--merah);line-height:1.1}
.stat span{font-weight:800;color:var(--tinta-2);font-size:14px}
.isi{display:grid;grid-template-columns:minmax(0,2.3fr) minmax(280px,1fr);gap:18px;align-items:start}
@media (max-width:1100px){.isi{grid-template-columns:1fr}}
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:end;gap:14px;max-width:560px;margin:6px auto 16px}
.pod{display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:800;min-width:0}
.pod .kpl{width:64px;height:64px}
.pod .nm{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:17px}
.pod .sk{font-family:var(--f-display);color:var(--merah);font-size:18px;font-variant-numeric:tabular-nums}
.pod .blok{width:100%;border-radius:12px 12px 0 0;display:grid;place-items:center;font:800 30px var(--f-display);color:#fff}
.pod.p1 .blok{height:110px;background:var(--kunyit);color:var(--tinta)}
.pod.p2 .blok{height:80px;background:#AEB6BD}
.pod.p3 .blok{height:60px;background:#D98C4A}
.tabel-wrap{overflow-x:auto}
table{width:100%;border-collapse:separate;border-spacing:0 6px;font-size:16px}
th{font:800 13px var(--f-body);color:var(--redup);text-align:left;padding:0 10px;white-space:nowrap}
td{background:#fff;padding:8px 8px;border-top:2px solid var(--garis);border-bottom:2px solid var(--garis);vertical-align:middle}
td:first-child{border-left:2px solid var(--garis);border-radius:12px 0 0 12px}
td:last-child{border-right:2px solid var(--garis);border-radius:0 12px 12px 0}
tr.bawah td{background:var(--bahaya-bg)}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.rk{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:#EFE1C4;font:800 16px var(--f-display);color:var(--tinta-2)}
tr.r1 .rk{background:var(--kunyit);color:var(--tinta)} tr.r2 .rk{background:#C9CED3;color:var(--tinta)} tr.r3 .rk{background:#D98C4A;color:#fff}
.siapa{display:flex;align-items:center;gap:10px;font-weight:800;min-width:0}
.siapa .kpl{width:34px;height:34px;flex:none}
.siapa .nmw{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:0}
.siapa .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:20ch}
.skor{font:800 20px var(--f-display);color:var(--merah)}
.prog{display:flex;align-items:center;gap:8px;min-width:96px}
.prog .b{flex:1;height:10px;border-radius:999px;background:#EFE1C4;overflow:hidden}
.prog .b i{display:block;height:100%;background:var(--daun);border-radius:999px}
.prog span{font-weight:800;font-size:13px;color:var(--tinta-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.dot{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:13px;color:var(--redup);white-space:nowrap}
.dot i{width:9px;height:9px;border-radius:50%;background:#C9B58E}
.dot.on{color:var(--daun-tua)} .dot.on i{background:var(--daun)}
.dot.tamat{color:var(--nila)} .dot.tamat i{background:var(--nila)}
.tag-bantu{display:inline-block;font:800 11px var(--f-body);background:var(--merah);color:#fff;border-radius:999px;padding:.1em .6em;vertical-align:middle}
.bintang{white-space:nowrap;font-size:13px;font-weight:800;color:var(--tinta-2)}
.bintang b{color:var(--kunyit-tua)}
.kosong{text-align:center;padding:30px 10px;color:var(--redup);font-weight:800}
.soal-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.soal-list li{border:2px solid var(--garis);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.soal-list .j{font-weight:700;font-size:14px;line-height:1.35}
.soal-list .m{display:flex;justify-content:space-between;gap:8px;font-weight:800;font-size:13px;color:var(--tinta-2)}
.soal-list .b{height:9px;border-radius:999px;background:#EFE1C4;overflow:hidden}
.soal-list .b i{display:block;height:100%}
.lvl{font:800 12px var(--f-body);background:#EFE1C4;color:var(--tinta-2);border-radius:999px;padding:.05em .6em}
.ket{margin:0 0 10px;font-weight:700;color:var(--redup);font-size:14px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--tinta);color:#FFF6E4;border-radius:999px;padding:.5em 1.2em;font-weight:800;z-index:20;max-width:92vw}
.proyektor .sembunyi-proyektor{display:none!important}
.proyektor main{max-width:none}
.proyektor table{font-size:20px}
.proyektor .skor{font-size:26px}
</style>
</head>
<body>
<header class="bar"><div class="brand"><b>Kampoeng Batik Jetis</b><span>Dasbor guru</span></div><a href="/" target="_blank" rel="noopener">Buka halaman pemain</a></header>
<main id="app"></main>
<div class="toast" id="toast" hidden></div>
<script src="/socket.io/socket.io.js"></script>
<script src="js/gambar.js"></script>
<script src="js/guru.js"></script>
</body>
</html>
